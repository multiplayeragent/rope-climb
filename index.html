<html lang="en">
<head>

<title>Rope Climb</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #6dbdf7; }
  body { font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; }
  .hud { position: fixed; pointer-events: none; text-shadow: 0 2px 4px #0009; }
  #height { top: max(10px, env(safe-area-inset-top)); left: max(14px, env(safe-area-inset-left)); font: 900 34px/1 system-ui, sans-serif; }
  #height small { display: block; margin-top: 4px; font-size: 13px; font-weight: 700; opacity: .92; }
  #team { top: max(10px, env(safe-area-inset-top)); right: max(14px, env(safe-area-inset-right)); font-size: 13px; font-weight: 700; min-width: 120px; }
  #team div { display: flex; justify-content: space-between; align-items: center; gap: 8px; } #team .me { color: #ffe14d; }
  #team i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; border: 1px solid #fff8; margin-right: 6px; }
  #team .head { opacity: .8; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
  #hint { left: 50%; top: 30%; transform: translateX(-50%); width: min(470px, calc(100vw - 32px)); text-align: center; font-size: 15px; font-weight: 700; padding: 10px 14px; border-radius: 14px; background: #0005; box-sizing: border-box; }
  #hint:empty { display: none; }
  #msg { top: 20%; left: 0; right: 0; text-align: center; font: 900 46px/1.05 system-ui, sans-serif; color: #ffe14d; -webkit-text-stroke: 2px #5a3000; transition: opacity .35s, transform .35s; opacity: 0; transform: scale(.85); }
  #msg small { display: block; font-size: 20px; color: #fff; -webkit-text-stroke: 0; margin-top: 6px; }
  #msg.on { opacity: 1; transform: scale(1); }
  #net { bottom: max(6px, env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center; font-size: 12px; opacity: .85; }
  #over { position: fixed; inset: 0; display: grid; place-items: center; background: #0a1a3088; }
  #over[hidden], .pad[hidden] { display: none; }
  .card { width: min(380px, calc(100vw - 32px)); max-height: 86vh; overflow: auto; padding: 20px; border-radius: 16px; background: #1b2347f2; border: 1px solid #ffffff2a; text-align: center; box-sizing: border-box; }
  .card h2 { margin: 0 0 4px; font-size: 26px; color: #ffe14d; } .card .sub { font-size: 14px; opacity: .9; }
  .card h3 { margin: 14px 0 4px; font-size: 13px; color: #9fd8ff; text-align: left; }
  .card ol { margin: 0; padding-left: 24px; font-size: 14px; text-align: left; } .card li span { float: right; font-variant-numeric: tabular-nums; } .card li.me { color: #ffe14d; font-weight: 700; }
  .card li.note { list-style: none; margin-left: -24px; opacity: .8; }
  .card p { margin: 10px 0 0; font-size: 13px; opacity: .75; }
  button.go { width: 100%; min-height: 48px; margin-top: 16px; border: 0; border-radius: 12px; background: #ffe14d; color: #3a2400; font: 800 17px system-ui, sans-serif; cursor: pointer; }
  .pad { position: fixed; bottom: calc(max(14px, env(safe-area-inset-bottom)) + 14px); display: flex; gap: 10px; align-items: flex-end; touch-action: none; }
  .pad button { width: 72px; height: 72px; border-radius: 50%; border: 2px solid #ffffff88; background: #00000030; color: #fff; font: 800 15px system-ui, sans-serif; touch-action: none; }
  .pad button.on { background: #ffffff55; }
  #padL { left: max(14px, env(safe-area-inset-left)); } #padR { right: max(14px, env(safe-area-inset-right)); }
  #padR [data-k="grip"] { background: #3d8bff66; } #padR [data-k="jump"] { width: 84px; height: 84px; background: #ff5a5f55; }
</style>
<script src="https://cdn.multiplayeragent.com/sdk/mp.global.js"></script>

<body>
<canvas id="game"></canvas>
<div class="hud" id="height"></div>

<div class="pad" id="padL" hidden><button data-k="left">◀</button><button data-k="right">▶</button></div>
<div class="pad" id="padR" hidden><button data-k="grip">GRIP</button><button data-k="jump" id="jumpBtn">JUMP</button></div>
<div id="over" hidden><div class="card">
  <h2 id="overTitle"></h2><div class="sub" id="overSub"></div>
  <h3>This climb</h3><ol id="results"></ol>
  <h3>Highest climbs</h3><ol id="board"><li class="note">Loading…</li></ol>
  <button class="go" id="again">Climb a new tower</button><p id="next"></p>
</div></div>
<script>
/* ═══ ROPE CLIMB · a Multiplayer Agent starter ══════════════════════════════════════════
 * You're roped together. Climb the tower as a team. Grip to catch a falling partner, haul
 * them back up, and don't let one slip drag everyone down. Co-op, 2–4 players; a bot partner
 * climbs with you when you're alone.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ the rope, jumps, the run timer, bots
 *   ZONES ......... the tower's look as you climb
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host, the shared clock
 *   TOWER ......... builds the tower level by level from the run's seed (the same for everyone)
 *   CLIMBERS ...... one physics step for anyone (you or a bot): walk, jump, grip, haul
 *   ROPE .......... the rope between neighbours in the chain: soft when they're loose, hard when they grip
 *   RUN (HOST) .... the team (who is roped to whom), the timer, the team's best height, the bots
 *   BOTS .......... the bot brain: climbs, waits for you, grips when you fall, hauls you up
 *   ME ............ your climber. Each player writes only its own.
 *   DRAW .......... sky, tower, platforms, the rope, climbers, particles
 *   HUD & CARD .... height, the team, the end-of-climb card, leaderboard
 *   INPUT ......... keyboard, and touch buttons
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - Each player writes its OWN entity: `p` (one JSON field: position, speed, facing, pose,
 *     gripping, how much rope it has hauled in, grounded, hanging, run id) about 14 times a
 *     second, `hb` (heartbeat) once a second, `n`/`c` (name, color) once.
 *   - The HOST is the lowest sessionId among live players (heartbeat seen in the last 3s),
 *     worked out every frame. Only the host writes `run` (ONE JSON field: id, version v,
 *     tower seed, phase climb|done, timestamps, the team in rope order, the team's best
 *     height), `bots` (the bot climbers, ~12/s) and `clk` (its clock). A new host adopts all three.
 *   - Everyone builds the same tower from run.seed. Nobody sends the tower.
 *   - The rope: each player simulates only its own body and pulls it toward its neighbours'
 *     published positions: a soft spring if they're loose (so a falling partner drags you), a
 *     hard rope if they grip (so you hang and swing). Nobody moves anyone else.
 *   - Intents to the host: "again" {} (start a new tower now, from the end card).
 *   - ?attract plays offline with bots only (the preview video is recorded from it).
 *   - Leaderboard "best-height": the team's best height (its lowest climber), on the end card.
 */

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {
  seats: 2,              // bots fill the rope up to this many climbers: alone, you get one partner
  maxTeam: 4,            // climbers on one rope
  runMs: 180000,         // one climb lasts this long
  doneMs: 14000,         // ms the end card shows before a new tower
  walk: 5.5,             // walking speed, tiles/s (1 tile = 1 meter)
  airSpeed: 5,           // sideways speed in the air
  airControl: 6,         // how quickly you can steer in the air
  swing: 14,             // how hard you can pump a swing while hanging
  groundGrip: 20, iceGrip: 2.5, // how quickly you speed up or stop on normal ground / ice
  jump: 15.5,            // jump speed (about 3 tiles high)
  gravity: 40, maxFall: 22,
  cutJump: 2.2,          // let go of jump early and gravity pulls harder: a small hop
  coyote: 0.1, buffer: 0.12,
  rope: 4.5,             // rope length between two neighbours, tiles
  minRope: 0.8,          // hauling can shorten it to this
  haulSpeed: 3.2,        // tiles of rope hauled in per second
  ropeK: 70,             // how hard a stretched rope pulls (per tile of stretch)
  ropeDamp: 6,           // ...and how much it damps bouncing
  friction: 22,          // standing on the ground resists this much sideways pull (grip resists all of it)
  restEvery: 25,         // a full-width rest ledge every this many meters: it catches every fall
  hardAt: 80,            // levels until platforms are as small and far apart as they get
  botLead: 3.2,          // a bot this far above its partner waits for it (gripping)
  botSlip: 0.12,         // chance a bot misjudges a jump
  botReact: [150, 400],  // ms a bot takes to grip when its partner falls
  sendMs: 70,            // how often your climber is sent (~14/s)
  board: "best-height",  // leaderboard: the team's best height, in meters
};
const BOT_NAMES = ["Tenzing", "Pip", "Carabina", "Belay", "Knot", "Hitch"];
const COLORS = ["#ff5a5f", "#3d8bff", "#ffb627", "#2fbf71", "#a463f2", "#ff7ac6", "#13c4c4", "#ff8a3d", "#8bd450", "#6b7cff"];

// ── ZONES ───────────────────────────────────────────────────────────────────────────
// The tower changes look every 25 m. sky = [top, bottom] colors; plat/top = platform body and its top edge.
const ZONES = [
  { from: 0,   name: "Base Camp",  sky: ["#6dbdf7", "#d6f1ff"], plat: "#8f5b37", top: "#5fcf5f", wall: "#b9a58a" },
  { from: 25,  name: "Pine Ridge", sky: ["#4aa6e8", "#c9ecd2"], plat: "#6b4426", top: "#3fae4f", wall: "#8a7a5e" },
  { from: 50,  name: "Cloud Line", sky: ["#ff9fb2", "#ffe6c8"], plat: "#efe6ee", top: "#ffffff", wall: "#d9bccb" },
  { from: 75,  name: "Ice Wall",   sky: ["#3f6fd1", "#bfe3ff"], plat: "#7fa9c9", top: "#e7f7ff", wall: "#8fa8c4" },
  { from: 100, name: "Summit Sky", sky: ["#0b1030", "#2d2a6e"], plat: "#4a5590", top: "#9fdcff", wall: "#383d6e", stars: true },
];
const zoneAt = (m) => { let z = ZONES[0]; for (const q of ZONES) if (m >= q.from) z = q; return z; };

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'rope-climb',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',
};
const ATTRACT = new URLSearchParams(location.search).has("attract");
const $ = (id) => document.getElementById(id);

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */
function localRoom() {
  const id = "local", state = { entities: { players: { [id]: {} } }, shared: {} }, subs = [];
  let queued = false;
  const emit = () => { if (!queued) { queued = true; queueMicrotask(() => { queued = false; subs.forEach((f) => f(state)); }); } };
  const put = (o, k, v) => { if (typeof k === "object") Object.assign(o, k); else o[k] = v; emit(); };
  return {
    sessionId: id, state, offline: true,
    me: { set: (k, v) => put(state.entities.players[id], k, v) },
    setShared: (k, v) => put(state.shared, k, v),
    onState: (f) => { subs.push(f); f(state); }, onJoin() {}, onLeave() {}, on() {}, send() {},
    onDisconnect() {}, onReconnect() {}, leave: async () => {},
  };
}
async function connect() {
  if (ATTRACT || typeof MP === "undefined") return localRoom();
  try {
    const mp = await Promise.race([MP.join({ ...MP_CONNECT }), new Promise((_, no) => setTimeout(() => no(new Error("timed out")), 10000))]);
    window.mp = mp; // the builder calls window.mp.leave() when the page closes
    return mp;
  } catch (e) {
    console.warn("Playing offline:", e && e.message);
    return localRoom();
  }
}
const parse = (v, fb) => { if (typeof v !== "string") return fb; try { return JSON.parse(v); } catch { return fb; } };
const parsed = new Map();
/** A JSON value from state, parsed once per change (read-only: never mutate what this returns). */
function parseOnce(key, raw, fallback) {
  const c = parsed.get(key);
  if (c && c.raw === raw) return c.v;
  const v = parse(raw, fallback); parsed.set(key, { raw, v }); return v;
}
const shared = (key, fallback) => parseOnce("s:" + key, S.shared[key], fallback);
let net = null, S = { entities: { players: {} }, shared: {} };
const seenHb = new Map();
/** Players whose heartbeat moved in the last 3s (plus us), sorted by sessionId. */
function livePlayers() {
  const now = performance.now(), out = [];
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    const s = seenHb.get(id);
    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });
    if (id === net.sessionId || now - seenHb.get(id).at < 3000) out.push(id);
  }
  return out.sort();
}
let hostHold = 0, lastTick = performance.now(); // lastTick: when frame() last ran; hostHold: after a freeze, no hosting before this time (see frame())
const isHost = () => performance.now() > hostHold && performance.now() - lastTick < 1000 && livePlayers()[0] === net.sessionId; // a tab whose loop has stopped doesn't host
// The shared clock: the host's Date.now() plus its own offset, learned from `clk` changes.
const clockSync = { offset: 0, seen: undefined, samples: [], lastWrite: 0 };
const clock = () => Date.now() + clockSync.offset;
function syncClock(now) {
  if (isHost()) { if (now - clockSync.lastWrite > 2000) { clockSync.lastWrite = now; net.setShared("clk", clock()); } return; }
  const clk = Number(S.shared.clk);
  if (!clk || clk === clockSync.seen) return;
  if (clockSync.seen !== undefined) { // the first value we see may be old; later changes are fresh
    clockSync.samples = [...clockSync.samples.slice(-4), clk - Date.now()];
    clockSync.offset = Math.max(...clockSync.samples); // the least-delayed sample is the best
  }
  clockSync.seen = clk;
}

// ── TOWER ───────────────────────────────────────────────────────────────────────────
// The tower is COLS tiles wide. y grows DOWNWARD: the ground is y = 0, 25 m up is y = -25.
// It's built level by level, upward, as far as anyone looks; level k only depends on the seed.
const COLS = 14;
function mulberry32(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
let towerSeed = -1;
const levels = [];
function useTower(seed) { if (seed !== towerSeed) { towerSeed = seed; levels.length = 0; } }
const plat = (k, x, y, w, kind) => ({ k, x, y, w, kind });
/** One level: a platform you can reach from the level below (`main`), sometimes a second one. */
function makeLevel(k) {
  if (k === 0) { const g = plat(0, 0, 0, COLS, "ground"); return { k, y: 0, main: g, plats: [g] }; }
  const prev = levels[k - 1], rnd = mulberry32(towerSeed * 31 + k * 7919), diff = Math.min(1, k / CONFIG.hardAt);
  const y = prev.y - (1.7 + rnd() * (0.6 + diff * 0.4)); // 1.7 to 2.7 tiles above the last level: one jump
  const ledge = Math.floor(-y / CONFIG.restEvery);
  if (ledge > Math.floor(-prev.y / CONFIG.restEvery)) { const r = plat(k, 0, -ledge * CONFIG.restEvery, COLS, "rest"); return { k, y: r.y, main: r, plats: [r], rest: ledge * CONFIG.restEvery }; }
  const from = prev.main, w = Math.max(1.4, 3.4 - diff * 1.8 + rnd() * 0.8);
  const gap = -0.6 + rnd() * (2.2 + diff * 0.8); // edge to edge, sideways (below 0: overlapping)
  let dir = rnd() < 0.5 ? -1 : 1, x = 0;
  const place = () => (x = from.w >= COLS ? 0.6 + rnd() * (COLS - 1.2 - w) : dir > 0 ? from.x + from.w + gap : from.x - gap - w);
  place();
  if (x < 0.4 || x + w > COLS - 0.4) { dir = -dir; place(); }
  x = Math.max(0.4, Math.min(COLS - 0.4 - w, x));
  const main = plat(k, x, y, w, k > 12 && rnd() < 0.08 + diff * 0.15 ? "ice" : "plain"), plats = [main];
  if (rnd() < 0.5 - diff * 0.2) { // a second platform on the other side
    const w2 = Math.max(1.3, w - 0.3), x2 = x + w / 2 < COLS / 2 ? x + w + 1.5 + rnd() * (COLS - x - w - 2 - w2) : 0.4 + rnd() * (x - 1.9 - w2);
    if (x2 >= 0.4 && x2 + w2 <= COLS - 0.4) plats.push(plat(k, x2, y + (rnd() - 0.5) * 1.0, w2, "plain"));
  }
  return { k, y, main, plats };
}
function levelAt(k) { while (levels.length <= k) levels.push(makeLevel(levels.length)); return levels[k]; }
/** Every platform with its top between y0 (higher up) and y1 (lower down). */
function platsBetween(y0, y1) {
  levelAt(0);
  while (levels[levels.length - 1].y > y0 - 6) levelAt(levels.length);
  let lo = 0, hi = levels.length - 1;
  while (lo < hi) { const m = (lo + hi) >> 1; if (levels[m].y > y1 + 1) lo = m + 1; else hi = m; } // the first level at or above y1
  const out = [];
  for (let k = lo; k < levels.length && levels[k].y >= y0 - 1; k++) for (const p of levels[k].plats) if (p.y >= y0 && p.y <= y1) out.push(p);
  return out;
}
const levelOfHeight = (m) => { let k = 0; while (levelAt(k + 1).y >= -m) k++; return k; };

// ── CLIMBERS ────────────────────────────────────────────────────────────────────────
const HW = 0.32, HH = 0.85; // half width and height of a climber, in tiles (x is the middle, y the feet)
const newClimber = (x, y, ground) => ({ x, y, vx: 0, vy: 0, f: 1, ground, grip: false, rl: 0, coyote: 0, buffer: 0, hang: false, top: y });
const heightOf = (b) => Math.max(0, -b.y);
/** Pose for drawing: 0 stand, 1 walk, 2 air, 3 grip, 4 hang. */
const anim = (b) => (b.grip ? 3 : b.hang ? 4 : !b.ground ? 2 : Math.abs(b.vx) > 0.6 ? 1 : 0);
const overlaps = (b, p) => b.x + HW - 0.08 > p.x && b.x - HW + 0.08 < p.x + p.w;
/** You can grip the ground you stand on, or the tower wall you're touching. */
const canGrip = (b) => !!b.ground || b.x <= HW + 0.06 || b.x >= COLS - HW - 0.06;
/** One physics step. input = { dir -1|0|1, jump (pressed now), held, grip (held), haul (held) }. Returns "jump", "land", "grip" or null. */
function stepClimber(b, inp, dt) {
  let ev = null;
  if (inp.grip && canGrip(b)) { if (!b.grip) ev = "grip"; b.grip = true; } else b.grip = false;
  b.rl = b.grip && inp.haul ? Math.min(CONFIG.rope - CONFIG.minRope, b.rl + CONFIG.haulSpeed * dt) : b.grip ? b.rl : Math.max(0, b.rl - CONFIG.haulSpeed * 1.5 * dt);
  if (b.grip) { b.vx = b.vy = 0; if (b.ground) b.y = b.ground.y; b.top = b.y; return ev; } // gripping: you don't budge
  const dir = inp.dir || 0;
  if (b.ground) { const g = b.ground.kind === "ice" ? CONFIG.iceGrip : CONFIG.groundGrip; b.vx += (dir * CONFIG.walk - b.vx) * Math.min(1, g * dt); }
  else if (b.hang) b.vx += dir * CONFIG.swing * dt; // pump the swing
  else if (dir) b.vx += (dir * CONFIG.airSpeed - b.vx) * Math.min(1, CONFIG.airControl * dt);
  if (dir) b.f = dir;
  b.coyote = b.ground ? CONFIG.coyote : b.coyote - dt;
  b.buffer = inp.jump ? CONFIG.buffer : b.buffer - dt;
  if (b.buffer > 0 && b.coyote > 0) { b.vy = -CONFIG.jump; b.coyote = b.buffer = 0; b.ground = null; b.top = b.y; ev = "jump"; }
  b.x += b.vx * dt;
  if (b.x < HW || b.x > COLS - HW) { const side = b.x < HW ? 1 : -1; b.x = side > 0 ? HW : COLS - HW; if (b.vx * side < 0) b.vx = b.ground ? 0 : -b.vx * 0.3; }
  if (b.ground) { // walked off the edge?
    if (!overlaps(b, b.ground)) { b.ground = null; b.top = b.y; b.vy = 0; }
    else { b.y = b.ground.y; b.vy = 0; }
  }
  if (!b.ground) {
    const prevY = b.y, vy0 = b.vy;
    b.vy = Math.min(CONFIG.maxFall, b.vy + CONFIG.gravity * (b.vy < 0 && !inp.held && !b.hang ? CONFIG.cutJump : 1) * dt);
    b.y += ((vy0 + b.vy) / 2) * dt;
    b.top = Math.min(b.top, b.y);
    if (b.vy >= 0) for (const p of platsBetween(prevY - 0.01, b.y + 0.01)) { // platforms catch you from above; you pass up through them
      if (overlaps(b, p) && prevY <= p.y + 0.02 && b.y >= p.y) { b.y = p.y; b.vy = 0; b.ground = p; ev = "land"; break; }
    }
  }
  return ev;
}

// ── ROPE ────────────────────────────────────────────────────────────────────────────
// Neighbours in run.team are roped together. Each body is pulled only by ITS OWN sim, toward
// where its neighbours are (as this screen sees them). n = { x, y, vx, vy, g (gripping), rl (hauled in) }.
const ropeLen = (a, b) => CONFIG.rope - Math.max(a.rl || 0, b.rl || 0);
/** Where the rope ties on: the middle of the body, or overhead while hauling. */
const tieY = (n) => n.y - HH * 0.55 - (n.g && n.rl > 0.05 ? 0.9 : 0);
/** Pull body b toward its neighbours. Returns how hard it got yanked (for effects). */
function applyRope(b, ns, dt) {
  b.hang = false;
  if (b.grip) return 0;
  let yank = 0;
  for (const n of ns) {
    const L = ropeLen(b, n), ax = n.x, ay = tieY(n), by = b.y - HH * 0.55;
    const dx = b.x - ax, dy = by - ay, d = Math.hypot(dx, dy);
    if (d <= L || d < 1e-4) continue;
    const ux = dx / d, uy = dy / d, vr = (b.vx - (n.vx || 0)) * ux + (b.vy - (n.vy || 0)) * uy; // vr > 0: moving apart
    if (n.g) { // they grip: a hard rope. You hang from them and can swing.
      b.x = Math.max(HW, Math.min(COLS - HW, ax + ux * L)); b.y = ay + uy * L + HH * 0.55;
      if (vr > 0) { yank = Math.max(yank, vr); b.vx -= ux * vr; b.vy -= uy * vr; }
      if (uy > 0.25) { b.hang = true; if (b.ground && b.ground.y > b.y + 0.01) b.ground = null; }

  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const starA = Math.max(0, Math.min(1, (m - 92) / 15));
  if (starA > 0) { ctx.fillStyle = `rgba(255,255,255,${starA})`; for (const s of STARS) { const y = ((s.y * H + m * TS * 0.05) % H + H) % H; ctx.fillRect(s.x * W, y, s.s, s.s); } }
  ctx.fillStyle = m > 95 ? "#ffffff10" : "#ffffffb0";
  for (const c of PUFFS) {
    const y = H / 2 + (c.y - cam.y * 0.45) * TS * 0.6, x = ((c.x * W + t * 6 * c.s) % (W + 300)) - 150, s = c.s * TS;
    if (y < -s || y > H + s) continue;
    for (const [dx, dy, rx, ry] of [[0, 0, 1.4, 0.5], [0.8, -0.25, 0.8, 0.5], [-0.7, -0.15, 0.7, 0.42]]) { ctx.beginPath(); ctx.ellipse(x + dx * s, y + dy * s, rx * s, ry * s, 0, 0, 7); ctx.fill(); }
  }
  for (const [k, color, base] of [[0.2, "#8aa3c9", 2], [0.35, "#6d8bb5", 4]]) { // far peaks
    const y0 = H / 2 + (base - cam.y * k) * TS; if (y0 > H + TS * 6) continue;
    ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(0, H);
    for (let x = 0; x <= W + 30; x += 30) ctx.lineTo(x, y0 - Math.abs(Math.sin(x / 140 + base)) * TS * 4 - Math.sin(x / 53) * TS * 0.4);
    ctx.lineTo(W, H); ctx.fill();
  }
}
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function drawWalls() { // the tower's two rock walls, scrolling with the climb
  const left = sx(0), right = sx(COLS), bw = TS * 1.2, z = zoneAt(Math.max(0, -cam.y));
  for (const [x0, x1] of [[Math.min(left - bw, 0), left], [right, Math.max(right + bw, W)]]) {
    ctx.fillStyle = z.wall; ctx.fillRect(x0, 0, x1 - x0, H);
    ctx.fillStyle = "#00000022";
    const row = TS * 0.7, off = ((-cam.y * TS) % (row * 2) + row * 2) % (row * 2);
    for (let y = -row * 2 + off; y < H + row; y += row) { ctx.fillRect(x0, y, x1 - x0, 2); const shift = Math.round((y - off) / row) % 2 ? TS * 0.5 : 0; for (let x = x0 - (x0 % TS) + shift; x < x1; x += TS) if (x >= x0) ctx.fillRect(x, y, 2, row); }
  }
  ctx.fillStyle = "#00000033"; ctx.fillRect(left - 4, 0, 4, H); ctx.fillRect(right, 0, 4, H);
}
function drawPlatform(p) {
  const x = sx(p.x), y = sy(p.y), w = p.w * TS, h = TS * 0.48, z = zoneAt(-p.y);
  if (p.kind === "ground") { ctx.fillStyle = "#8f5b37"; ctx.fillRect(x, y, w, H); ctx.fillStyle = "#5fcf5f"; ctx.fillRect(x, y, w, TS * 0.3); ctx.fillStyle = "#86e276"; ctx.fillRect(x, y, w, TS * 0.1); return; }
  if (p.kind === "rest") {
    ctx.fillStyle = "#e9dcc0"; rr(x, y, w, h * 1.2, TS * 0.1); ctx.fill(); ctx.fillStyle = "#c9b48a"; ctx.fillRect(x, y + h * 0.9, w, h * 0.3);
    ctx.fillStyle = "#6b4a26"; ctx.font = `900 ${Math.round(TS * 0.42)}px system-ui`; ctx.textAlign = "center"; ctx.fillText(`${-p.y} m · ${zoneAt(-p.y).name}`, x + w / 2, y + h * 0.82);
    return;
  }
  const body = p.kind === "ice" ? "#bfefff" : z.plat, lip = p.kind === "ice" ? "#ffffff" : z.top;
  ctx.fillStyle = body; rr(x, y, w, h, TS * 0.14); ctx.fill();
  ctx.fillStyle = lip; rr(x, y, w, h * 0.38, TS * 0.12); ctx.fill();
  if (p.kind === "ice") { ctx.fillStyle = "#ffffffaa"; ctx.fillRect(x + w * 0.15, y + h * 0.55, w * 0.25, 2); ctx.fillRect(x + w * 0.55, y + h * 0.65, w * 0.2, 2); }
}
/** The rope between two neighbours: sagging when slack, straight when taut. */
function drawRope(a, b) {
  const ax = sx(a.x), ay = sy(tieY(a)), bx = sx(b.x), by = sy(tieY(b)), L = ropeLen(a, b) * TS, d = Math.hypot(bx - ax, by - ay);
  const sag = d < L ? Math.sqrt(L * L - d * d) * 0.55 : 0, mx = (ax + bx) / 2, my = (ay + by) / 2 + sag;
  ctx.lineCap = "round";
  ctx.strokeStyle = "#6b4a2655"; ctx.lineWidth = Math.max(4, TS * 0.14); ctx.beginPath(); ctx.moveTo(ax, ay + 2); ctx.quadraticCurveTo(mx, my + 2, bx, by + 2); ctx.stroke();
  ctx.strokeStyle = d >= L - 2 ? "#ffcf6e" : "#e8c27a"; ctx.lineWidth = Math.max(3, TS * 0.1); ctx.beginPath(); ctx.moveTo(ax, ay); ctx.quadraticCurveTo(mx, my, bx, by); ctx.stroke();
  ctx.strokeStyle = "#a8743a"; ctx.lineWidth = Math.max(1, TS * 0.03); ctx.setLineDash([TS * 0.12, TS * 0.12]); ctx.beginPath(); ctx.moveTo(ax, ay); ctx.quadraticCurveTo(mx, my, bx, by); ctx.stroke(); ctx.setLineDash([]);
}
function drawClimber(c, t) {
  const pose = c.a, x = sx(c.x), y = sy(c.y), w = HW * 2 * TS, h = HH * TS;
  const sq = pose === 3 ? 0.88 : pose === 2 || pose === 4 ? 1.05 : 1, step = pose === 1 ? Math.sin(t * 16 + c.x * 3) * TS * 0.1 : 0;
  ctx.fillStyle = "#00000030"; ctx.beginPath(); ctx.ellipse(x, y, w * 0.5, TS * 0.05, 0, 0, 7); ctx.fill();
  ctx.fillStyle = "#2b2140"; for (const s of [-1, 1]) { ctx.beginPath(); ctx.ellipse(x + s * (w * 0.22 - step), y - TS * 0.05, TS * 0.11, TS * 0.07, 0, 0, 7); ctx.fill(); } // feet
  const bw = w * (2 - sq) * 0.95, bh = h * sq * 0.9, top = y - bh - TS * 0.07;
  if (pose === 3 || pose === 4) { // arms up: gripping the rock, or holding the rope
    ctx.strokeStyle = c.color; ctx.lineWidth = TS * 0.12; ctx.lineCap = "round";
    for (const s of [-1, 1]) { ctx.beginPath(); ctx.moveTo(x + s * bw * 0.35, top + bh * 0.4); ctx.lineTo(x + s * bw * (pose === 3 ? 0.7 : 0.2), top - TS * 0.25); ctx.stroke(); }
    ctx.fillStyle = "#f4f0e6"; for (const s of [-1, 1]) { ctx.beginPath(); ctx.arc(x + s * bw * (pose === 3 ? 0.7 : 0.2), top - TS * 0.25, TS * 0.09, 0, 7); ctx.fill(); }
  }
  ctx.fillStyle = c.color; rr(x - bw / 2, top, bw, bh, TS * 0.18); ctx.fill();
  if (c.mine) { ctx.strokeStyle = "#ffffff"; ctx.lineWidth = Math.max(2, TS * 0.05); ctx.stroke(); }
  ctx.fillStyle = "#ffffff38"; rr(x - bw / 2 + TS * 0.06, top + TS * 0.05, bw - TS * 0.12, bh * 0.25, TS * 0.1); ctx.fill();
  ctx.fillStyle = "#ffffffcc"; ctx.fillRect(x - bw / 2, top + bh * 0.62, bw, TS * 0.08); // the harness
  for (const s of [-1, 1]) {
    const ex = x + c.f * w * 0.14 + s * w * 0.17, ey = top + bh * 0.3;
    if (pose === 3) { ctx.strokeStyle = "#1b1f3b"; ctx.lineWidth = Math.max(1.5, TS * 0.045); ctx.beginPath(); ctx.moveTo(ex - TS * 0.07, ey); ctx.lineTo(ex + TS * 0.07, ey); ctx.stroke(); continue; } // squinting with effort
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(ex, ey, TS * 0.09, 0, 7); ctx.fill();
    ctx.fillStyle = "#1b1f3b"; ctx.beginPath(); ctx.arc(ex + c.f * TS * 0.035, ey + (pose === 4 ? TS * 0.03 : 0), TS * 0.045, 0, 7); ctx.fill();
  }
  if (!ATTRACT) {
    ctx.font = `700 ${Math.max(11, Math.round(TS * 0.3))}px system-ui`; ctx.textAlign = "center"; ctx.lineWidth = 3; ctx.strokeStyle = "#0008";
    const label = c.mine ? "You" : c.name || "";
    ctx.strokeText(label, x, top - TS * 0.42); ctx.fillStyle = c.mine ? "#ffe14d" : "#fff"; ctx.fillText(label, x, top - TS * 0.42);
  }
}
/** Everyone on the rope, in rope order, as this screen shows them. */
function teamBodies(r) {
  return r.team.map((id) => {
    if (id === me.id) return { ...me, id, a: anim(me), g: me.grip ? 1 : 0, mine: !ATTRACT, name: myName, color: me.color };
    const hb = host.acting && host.bots.get(id);
    if (hb) return { ...hb, a: anim(hb), g: hb.grip ? 1 : 0, name: hb.name, color: hb.color };
    const v = views.get(id);
    return v ? { ...v, name: nameOf(id), color: colorOf(id) } : null;
  });
}
function draw(now, dt, r) {
  const touch = touchUI && H > W;
  TS = ATTRACT ? H / 10 : Math.min(W / (COLS + 0.8), H / 13);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (!r) { drawBackground(now / 1000); return; }
  const bodies = teamBodies(r), alive = bodies.filter(Boolean);
  const bottomPad = touch ? 130 : 30, floorLimit = -(H / 2 - bottomPad) / TS; // never show below the ground
  const focusY = ATTRACT || !r.team.includes(me.id) ? alive.reduce((a, b) => a + b.y, 0) / Math.max(1, alive.length) : me.y;
  const want = Math.min(floorLimit, focusY - (touch ? 1.5 : 2));
  cam.y += (want - cam.y) * Math.min(1, 4 * dt);
  shake *= 0.86;
  ctx.setTransform(DPR, 0, 0, DPR, (Math.random() - 0.5) * shake * DPR, (Math.random() - 0.5) * shake * DPR);
  drawBackground(now / 1000); drawWalls();
  const y0 = cam.y - H / 2 / TS - 1, y1 = cam.y + H / 2 / TS + 1;
  for (const p of platsBetween(y0, y1)) drawPlatform(p);
  for (let i = 1; i < bodies.length; i++) if (bodies[i - 1] && bodies[i]) drawRope(bodies[i - 1], bodies[i]);
  for (const c of alive) drawClimber(c, now / 1000);
  for (const p of parts) { ctx.globalAlpha = Math.min(1, (p.life / p.max) * 2); ctx.fillStyle = p.color; ctx.fillRect(sx(p.x) - (p.size * TS) / 2, sy(p.y) - (p.size * TS) / 2, p.size * TS, p.size * TS); }
  ctx.globalAlpha = 1;
}
function tickFx(dt) { for (let i = parts.length - 1; i >= 0; i--) { const p = parts[i]; p.life -= dt; p.vy += p.grav * dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.life <= 0) parts.splice(i, 1); } }

// ── HUD & CARD ──────────────────────────────────────────────────────────────────────
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
let reconnecting = false, startedAt = 0, toastTimer = 0;
function toast(big, small = "", ms = 1600) { if (ATTRACT) return; const m = $("msg"); m.innerHTML = `${esc(big)}${small ? `<small>${esc(small)}</small>` : ""}`; m.classList.add("on"); clearTimeout(toastTimer); toastTimer = setTimeout(() => m.classList.remove("on"), ms); }
const mmss = (ms) => { const s = Math.max(0, Math.ceil(ms / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
function hud(now, r) {
  const n = livePlayers().length;
  $("net").textContent = ATTRACT ? "" : net.offline ? "Offline: playing with a bot partner" : reconnecting ? "Reconnecting…" : `Online · ${n} player${n === 1 ? "" : "s"}${isHost() ? " · you run the climb" : ""}`;
  if (ATTRACT) { for (const id of ["height", "team", "hint"]) $(id).textContent = ""; return; }
  const th = Math.floor(teamHeight(r)), T = clock();
  $("height").innerHTML = `${th} m<small>team height · best ${Math.max(r.best, th)} m · ${r.phase === "climb" ? mmss(r.endsAt - T) + " left" : "time!"}</small>`;
  $("team").innerHTML = `<div class="head"><span>On the rope</span></div>` + r.team.map((id) => { const b = bodyOf(id); return `<div class="${id === me.id ? "me" : ""}"><span><i style="background:${colorOf(id)}"></i>${esc(id === me.id ? "You" : nameOf(id))}</span><span>${b ? Math.floor(heightOf(b)) : "–"} m</span></div>`; }).join("");
  $("hint").textContent = r.phase !== "climb" ? "" : !r.team.includes(me.id) ? "The rope is full: you're watching. You'll tie on when a spot opens."
    : now - startedAt < 16000 ? (touchUI ? "◀ ▶ walk · JUMP · hold GRIP to hold on (and catch your partner) · GRIP + HAUL pulls them up" : "Arrows/A D walk · Space jump · hold Shift or S to grip (catch your partner) · grip + Space hauls them up") : "";
  $("jumpBtn").textContent = input.grip ? "HAUL" : "JUMP";
  const z = zoneAt(heightOf(me)).name; if (z !== me.zone) { if (me.zone) toast(z, "a new part of the tower"); me.zone = z; }
  const showCard = r.phase === "done";
  $("over").hidden = !showCard;
  if (showCard) {
    $("next").textContent = `New tower in ${Math.max(0, Math.ceil((r.endsAt - T) / 1000))}s`;
    if (me.shownFor !== r.id) { me.shownFor = r.id; openCard(r); }
  }
}
function openCard(r) {
  $("overTitle").textContent = `${r.best} m`;
  $("overSub").textContent = r.best >= 50 ? "What a climb. The rope held." : r.best >= 25 ? "Past the first rest ledge!" : "Stick together and grip when someone slips.";
  $("results").innerHTML = (r.res || []).map((s) => `<li class="${s.i === me.id ? "me" : ""}">${esc(s.i === me.id ? myName : s.n)}<span>${s.m} m</span></li>`).join("");
  const list = $("board");
  if (!board) { list.innerHTML = "<li class=\"note\">Leaderboards need a connection.</li>"; return; }
  list.innerHTML = "<li class=\"note\">Loading…</li>";
  (r.best >= 1 && r.team.includes(me.id) ? board.submit(r.best).catch(() => null) : Promise.resolve()).then(() => board.top(10)).then(({ entries }) => {
    list.innerHTML = entries.length ? entries.map((e) => `<li>${esc(e.username || "Player")}<span>${e.score} m</span></li>`).join("") : "<li class=\"note\">No climbs yet. Set the first.</li>";
  }).catch(() => { list.innerHTML = "<li class=\"note\">Couldn't load the leaderboard.</li>"; });
}
$("again").onclick = () => { if (host.acting) host.again = true; else net.send("again", {}); };
let actx = null;
function sfx(kind) {
  if (!actx || ATTRACT) return;
  const [f0, f1, dur, vol, type] = { jump: [300, 650, 0.14, 0.05, "triangle"], grip: [180, 120, 0.08, 0.07, "square"], catch: [500, 140, 0.3, 0.08, "sawtooth"], fall: [700, 120, 0.6, 0.07, "sawtooth"], up: [520, 1040, 0.5, 0.08, "triangle"] }[kind];
  const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur);
}

// ── INPUT ───────────────────────────────────────────────────────────────────────────
const touchUI = matchMedia("(pointer: coarse)").matches && !ATTRACT;
$("padL").hidden = $("padR").hidden = !touchUI;
const wake = () => { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch {} } };
const KEYS = { arrowleft: "left", a: "left", arrowright: "right", d: "right", shift: "grip", s: "grip", arrowdown: "grip" }, JUMPS = [" ", "arrowup", "w", "z"];
addEventListener("keydown", (e) => {
  wake(); const k = e.key.toLowerCase();
  if (KEYS[k]) { e.preventDefault(); input[KEYS[k]] = true; }
  if (JUMPS.includes(k)) { e.preventDefault(); if (!e.repeat) input.jump = true; input.held = true; }
});
addEventListener("keyup", (e) => { const k = e.key.toLowerCase(); if (KEYS[k]) input[KEYS[k]] = false; if (JUMPS.includes(k)) input.held = false; });
addEventListener("blur", () => { input.left = input.right = input.held = input.grip = false; });
for (const b of document.querySelectorAll(".pad button")) {
  const k = b.dataset.k;
  b.addEventListener("pointerdown", (e) => { e.preventDefault(); wake(); b.setPointerCapture(e.pointerId); if (k === "jump") input.jump = input.held = true; else input[k] = true; b.classList.add("on"); });
  for (const ev of ["pointerup", "pointercancel"]) b.addEventListener(ev, () => { if (k === "jump") input.held = false; else input[k] = false; b.classList.remove("on"); });
}
cv.addEventListener("pointerdown", wake);
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
let last = performance.now(), lastHb = 0, lastHud = 0;
function frame(now) {
  requestAnimationFrame(frame);
  if (performance.now() - lastTick > 1000) { hostHold = performance.now() + 700; host.acting = false; } // the tab was frozen or in the background: someone else may have hosted meanwhile, so let its state arrive, then adopt it
  lastTick = performance.now(); // not the rAF time: after a long freeze Chrome can stamp the first frame from before it ended
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now; // the first frame can be timed before load: never negative
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); fixColor(); }
  syncClock(now);
  if (isHost()) hostTick(dt, now); else host.acting = false;
  const r = run();
  if (r) { useTower(r.seed); syncViews(dt, r); myTick(dt, now, r); }
  tickFx(dt);
  draw(now, dt, r);
  if (r && now - lastHud > 150) { lastHud = now; hud(now, r); }
}

(async function start() {
  net = await connect();
  net.onState((st) => { S = st; });
  net.on("again", () => { if (host.acting) host.again = true; });
  net.onDisconnect(() => { reconnecting = true; $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { reconnecting = false; });
  if (!net.offline && typeof MP !== "undefined") board = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const taken = new Set([...Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c), ...shared("bots", []).map((b) => b.c)]);
  me.id = net.sessionId; me.color = COLORS.find((c) => !taken.has(c)) || COLORS[Math.floor(Math.random() * COLORS.length)];
  net.me.set({ n: myName, c: me.color, hb: Date.now() });
  if (ATTRACT) Object.assign(CONFIG, { seats: 3, botSlip: 0.3, botReact: [80, 200] }); // the preview: three on a rope, a little clumsy, starting high up
  startedAt = performance.now();
  requestAnimationFrame(frame);
})();
</script>
